name: Presentación EDO · validación
on:
  pull_request:
    paths:
      - "isogonales/**"
      - ".github/workflows/isogonales-checks.yml"
  push:
    branches:
      - "edo-trayectorias-isogonales-2026"
    paths:
      - "isogonales/**"
      - ".github/workflows/isogonales-checks.yml"
jobs:
  isogonales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis
        run: |
          node --check isogonales/dist/model.js
          node --check isogonales/dist/app.js
          node --check isogonales/dist/latex.js
      - name: Ejecutar pruebas matemáticas y de interfaz
        run: |
          node isogonales/test.cjs
          node isogonales/test-ui.cjs
          node isogonales/test-latex.cjs
          node isogonales/test-examples.cjs
          node isogonales/test-radial.cjs
          node isogonales/test-application.cjs

      - name: Instalar Chromium para revisión visual
        run: |
          npm --prefix isogonales install --no-save --no-audit --no-fund playwright@1.55.1
          ./isogonales/node_modules/.bin/playwright install --with-deps chromium
      - name: Prueba de presentación en navegador real
        run: node isogonales/browser-smoke.cjs
      - name: Recuperar página original del estudio de 2017
        run: |
          python3 -m venv /tmp/edoref
          /tmp/edoref/bin/pip -q install pymupdf pillow
          /tmp/edoref/bin/python - <<'PY'
          import fitz, urllib.request, os, ssl
          url='https://www.keldysh.ru/papers/2017/prep2017_33.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (educational slide review)'})
          # El servidor académico presenta una cadena de certificados incompleta.
          # Única excepción TLS para el PDF público de solo lectura; comprobar firma PDF.
          try:
              response=urllib.request.urlopen(req,timeout=45)
          except urllib.error.URLError as error:
              if not isinstance(error.reason,ssl.SSLCertVerificationError):
                  raise
              response=urllib.request.urlopen(req,timeout=45,context=ssl._create_unverified_context())
          with response:
              pdf=response.read()
          if not pdf.startswith(b'%PDF'): raise RuntimeError('La respuesta no es PDF')
          doc=fitz.open(stream=pdf,filetype='pdf')
          page=doc[9]
          print('Referencia original:', len(doc),'páginas; página 10:', page.rect)
          os.makedirs('isogonales/screenshots',exist_ok=True)
          page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False).save('isogonales/screenshots/07-original-articulo-p10.png')
          from PIL import Image
          from io import BytesIO
          import base64
          image=Image.open('isogonales/screenshots/07-original-articulo-p10.png')
          rectangles={10:(258,1257,515,1537),11:(512,1257,717,1537),12:(707,1257,942,1537)}
          for number,rect in rectangles.items():
              crop=image.crop(rect)
              output=BytesIO()
              crop.save(output,'WEBP',quality=94,method=6)
              print('GALANIN_ORIGINAL_FIG_'+str(number)+'='+base64.b64encode(output.getvalue()).decode('ascii'))
          PY
      - name: Guardar capturas para revisión humana
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isogonales-capturas
          path: isogonales/screenshots/*.png
          if-no-files-found: warn
