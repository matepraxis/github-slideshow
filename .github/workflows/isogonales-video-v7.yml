name: EDO · Generar video isogonal 4K (v7)
on:
  push:
    branches:
      - "fix/edo-video-isogonales-v7-4k"
    paths:
      - "isogonales/video/render_trayectorias_isogonales_v7.py"
      - ".github/workflows/isogonales-video-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias matemáticas y audiovisuales
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg poppler-utils texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core
          python -m pip install --no-cache-dir numpy pillow opencv-python-headless
      - name: Generar la animación corregida en 4K nativo
        run: |
          python -u isogonales/video/render_trayectorias_isogonales_v7.py
          cp isogonales/video/trayectorias_isogonales_v7_4K_UHD.mp4 isogonales/dist/assets/isogonales.mp4
      - name: Verificar duración, codificación y 4K a 30 FPS
        run: |
          python - <<'PY'
          import json, subprocess
          target='isogonales/dist/assets/isogonales.mp4'
          x=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-show_entries','stream=codec_name,width,height,r_frame_rate','-of','json',target],check=True,capture_output=True,text=True)
          data=json.loads(x.stdout)
          v=next(s for s in data['streams'] if s.get('codec_name')=='h264')
          assert (v['width'],v['height'])==(3840,2160),v
          assert v['r_frame_rate']=='30/1',v
          assert abs(float(data['format']['duration'])-95)<0.05,data
          print('Validado: H.264, 3840 x 2160, 30 FPS, 95 s')
          PY
      - name: Reemplazar video anterior y guardar en la rama de la presentación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isogonales/dist/assets/isogonales.mp4
          if ! git diff --cached --quiet; then
            git commit -m "EDO: reemplazar video anterior por versión 7 4K"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
